# Unit tests, vet and the frontend syntax check on every push and pull request.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # go vet compiles the GUI too, which links GTK 3 and WebKitGTK 4.1 through cgo.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test
