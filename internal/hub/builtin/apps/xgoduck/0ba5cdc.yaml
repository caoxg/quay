# Built-in Quay profile for XGO-Duck (Luwu Dynamics), used until the runtime repository ships its
# own quay.yaml. It only drives scripts that already live in that repository.
id: xgoduck
# For the runtime from commit 0ba5cdc (2026-11-16) on, until the next version in index.yaml. That commit
# merged the AI branch into master: the app became "XGO Duck AI" (voice chat, USB camera and audio,
# ToF, a phone cockpit on port 80), and its board setup grew from the 2 Mbps router link to the
# runtime's tools/install-ai-support.sh (Debian packages, a root helper service, USB role detection
# at boot, nginx, the default app).
from: 0ba5cdcc2fef9b0da12fa11b338926c1fad8496e
name: XGO-Duck
description: Duck-shaped biped robot (Microduck lineage) — walking and other policies at 50 Hz, voice chat, USB camera and audio, ToF.
# The robot seen from the side (white head with a yellow plate, servo neck, yellow feet); the
# runtime's own app.yaml uses the 🦆 emoji.
icon: |
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <g stroke="#2b2f33" stroke-width="1.6" stroke-linejoin="round">
      <path d="M21 44h8l-1 7h-6z" fill="#d5d8dc"/>
      <rect x="22.5" y="50" width="4.5" height="7" fill="#2b2f33"/>
      <rect x="18" y="56.5" width="12" height="4" rx="1.5" fill="#d9ab00"/>
      <rect x="14.5" y="33" width="4" height="13" rx="1" fill="#2f6f8f"/>
      <rect x="18" y="33.5" width="22" height="12" rx="3.5" fill="#fff"/>
      <path d="M30 44h8.5l-1 7h-6.5z" fill="#fff"/>
      <rect x="32" y="50" width="4.5" height="7" fill="#2b2f33"/>
      <rect x="30" y="56.5" width="13.5" height="4" rx="1.5" fill="#f6c700"/>
      <path d="M28 27h5.5l2.5 8h-5.5z" fill="#2b2f33"/>
      <path d="M9.5 24.5h50.5a1.8 1.8 0 0 1 0 4H9.5a1.8 1.8 0 0 1 0-4z" fill="#f6c700"/>
      <path d="M12 25.5C8.5 25.5 7.5 22 8.5 18.5C10 13.5 15 11.5 22 10.5L45 7.5C53 6.6 57.5 10.5 57.5 17V25.5Z" fill="#fff"/>
      <circle cx="48.5" cy="16" r="4" fill="#2b2f33"/>
    </g>
    <circle cx="49.4" cy="15.1" r="1.4" fill="#fff"/>
  </svg>
folder: xgoduck_runtime_arduino
# What the runtime's own App Lab ZIP leaves out (tools/package-ai-app.py): the 69 MB assembly slide deck and
# the ZIP itself (34 MB), about 100 MB that the app never reads.
exclude:
  - assembly/
  - packages/
source:
  repo: https://github.com/LuwuDynamics/xgoduck_runtime_arduino
match:
  repos:
    - github.com/LuwuDynamics/xgoduck_runtime_arduino
  app_names:
    - XGO Duck
    - XGO Duck AI

system:
  description: >-
    Runs the runtime's own setup as root: tools/install-ai-support.sh, then tools/router-2m.sh.
    It installs Debian packages (BlueZ, NetworkManager, ALSA and V4L tools, nginx and others), a root helper
    service in /usr/local/lib/xgoduck-ai-support (USB role detection at boot, gamepad, Wi‑Fi setup over
    Bluetooth), and the phone cockpit at http://<board>/ on port 80, which replaces nginx's default site.
    It also makes this app the board's default app, so it starts at boot, and compiles the MCU firmware once
    (it does not flash it). The router serial link goes to 2 Mbps for the whole board: other apps that expect
    the stock 115200 baud stop working until it is reverted.
    Every app must be stopped, and Quay must reach the board over Wi‑Fi: with a camera, microphone or speaker
    plugged in, the USB-C port switches to host mode, which drops a USB (adb) connection, so over USB the setup
    refuses to start. Run it again after an update changes the helper files; the check tells.
    Revert removes the services, the cockpit site and the 2 Mbps link; the Debian packages and the default
    app stay.
  description_zh: >-
    以 root 运行运行时自带的安装脚本：先 tools/install-ai-support.sh，再 tools/router-2m.sh。
    它会安装 Debian 软件包（BlueZ、NetworkManager、ALSA 和 V4L 工具、nginx 等），在 /usr/local/lib/xgoduck-ai-support
    装一个 root 辅助服务（开机检测 USB 角色、手柄、蓝牙配网），并在 80 端口装手机驾驶舱 http://<板子>/，替换 nginx 的默认站点。
    它还会把这个 App 设成板子的默认 App（开机自启），并把 MCU 固件编译一遍（不烧录）。
    Linux 和 MCU 之间的路由串口提速到 2 Mbps，这是全板设置：其他按默认 115200 波特率工作的 App 在撤销前都会失灵。
    执行前所有 App 都要停止，而且 Quay 要通过 Wi‑Fi 连板子：插着摄像头、麦克风或喇叭时，USB-C 口会切到主机模式，
    USB（adb）连接会断，所以经 USB 连接时设置会拒绝执行。更新改了辅助文件后要重新执行，检查会提示。
    撤销会删掉这些服务、驾驶舱站点和 2 Mbps 设置；Debian 软件包和默认 App 设置保留。
  # The helper files and units install-ai-support.sh puts in place, for this app folder (the units name it).
  # Every line must be a whole command: Quay joins the lines with " ; ".
  check: |
    root=$(pwd -P)
    grep -qs 2000000 /etc/systemd/system/arduino-router.service.d/90-xgoduck-baud.conf || exit 1
    grep -qsF -- "--app-root \"$root\"" /etc/systemd/system/xgoduck-ai-hardware.service || exit 1
    systemctl is-enabled --quiet xgoduck-ai-hardware.service || exit 1
    systemctl is-enabled --quiet xgoduck-ai-usb-startup.service || exit 1
    for f in tools/ai-support/ai_server.py tools/ai-support/audio_caps.py tools/ai-support/blufi.py tools/ai-support/provisioning.py tools/ai-support/usb_prepare.py tools/ai-support/sketch_cache.py tools/gamepad/server.py tools/gamepad/input_reader.py tools/gamepad/unitree_remote.py tools/gamepad/usb_role.py; do cmp -s "$f" "/usr/local/lib/xgoduck-ai-support/${f##*/}" || exit 1; done
    cmp -s tools/web/nginx-mobile.conf /etc/nginx/sites-available/xgoduck-mobile || exit 1
    [ -L /etc/nginx/sites-enabled/xgoduck-mobile ]
  # Quay runs apply, revert and before_start with bash -c, without -e.
  apply: |
    set -e
    # Over USB, adbd is one of this shell's ancestors.
    pid=$$
    while [ "${pid:-0}" -gt 0 ]; do
      if [ "$(ps -o comm= -p "$pid")" = adbd ]; then
        echo "Connect Quay to the board over Wi-Fi first: this setup can switch the USB-C port to host mode, which drops the USB (adb) connection." >&2
        exit 1
      fi
      pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
    done
    export DEBIAN_FRONTEND=noninteractive
    bash tools/install-ai-support.sh
    bash tools/router-2m.sh
  revert: |
    systemctl disable --now xgoduck-ai-hardware.service xgoduck-ai-usb-startup.service 2>/dev/null || true
    rm -f /etc/systemd/system/xgoduck-ai-hardware.service /etc/systemd/system/xgoduck-ai-usb-startup.service \
          /etc/systemd/system/arduino-app-cli.service.d/xgoduck-ai.conf
    rmdir /etc/systemd/system/arduino-app-cli.service.d 2>/dev/null || true
    rm -rf /usr/local/lib/xgoduck-ai-support
    if [ -L /etc/nginx/sites-enabled/xgoduck-mobile ]; then
      rm -f /etc/nginx/sites-enabled/xgoduck-mobile /etc/nginx/sites-available/xgoduck-mobile
      if [ -f /etc/nginx/sites-available/default ] && [ ! -e /etc/nginx/sites-enabled/default ]; then
        ln -s /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
      fi
      systemctl reload nginx 2>/dev/null || true
    fi
    rm -f /etc/systemd/system/arduino-router.service.d/90-xgoduck-baud.conf
    systemctl daemon-reload
    systemctl restart arduino-router
  stop_app: true

before_start:
  # Quay replaces everything in the app folder but data/ and .cache/, so the uv.toml that
  # configure-ai-python.py writes (the Python package index for the region in data/voice_config.json)
  # is written again after every deploy.
  run: |
    set -e
    python3 tools/configure-ai-python.py
    python3 tools/prepare-bridge.py
  description: Writes the app's Python package index for its region (tools/configure-ai-python.py), then patches the RouterBridge and RPClite libraries the sketch uses (a bigger RPC stack, bounded message framing) and rebuilds the firmware when they change.
  description_zh: 按 App 的选区写 Python 软件包源（tools/configure-ai-python.py），再给固件用到的 RouterBridge、RPClite 库打补丁（更大的 RPC 栈、限定长度的消息帧），库有变化时自动重新编译固件。
  resolve_on_failure: true
  rebuild_when_changed:
    - .arduino15/internal/Arduino_RouterBridge_*/Arduino_RouterBridge/src/bridge.h
    - .arduino15/internal/Arduino_RPClite_*/Arduino_RPClite/src/decoder.h
    - .arduino15/internal/Arduino_RPClite_*/Arduino_RPClite/src/duck_msgpack_frame.h

health:
  url: http://127.0.0.1:9527/api/status
  # The first start installs the app's Python packages (onnxruntime, numpy and the voice-chat ones) and
  # builds and flashes the firmware.
  timeout: 600

safety:
  url: http://127.0.0.1:9527/api/status
  field: enabled
  message: The servos are powered (torque on). Turn torque off in the duck's web UI or put the duck down first.
  also:
    - field: mode
      equals: [calibrate, servo_debug]
      message: Calibration or servo setup is open in the duck's web UI, and servos may be holding. Exit it first.

web:
  port: 9527

policies:
  # The runtime loads every model from python/ when it starts (python/controller.py).
  dir: python
  input: [1, 61]
  output: [1, 14]
  match_metadata: [joint_names, observation_names]
  # The unofficial community collection (policies/index.yaml), with a CDN copy for networks where
  # GitHub's raw files are slow.
  index:
    url: https://raw.githubusercontent.com/caoxg/awesome-xgo-duck/main/policies/index.yaml
    mirrors:
      - https://cdn.jsdelivr.net/gh/caoxg/awesome-xgo-duck@main/policies/index.yaml
  slots:
    - id: walk
      file: xgoduck_walk.onnx
      name: Walk
      name_zh: 行走
      description: Default walking model, also used for the recovery walk.
    - id: roller
      file: xgoduck_roller.onnx
      name: Roller walk
      name_zh: 轮滑
      description: Used in Roller mode. The runtime takes its home pose from the model's default_joint_pos.
      require_metadata: [default_joint_pos]
    - id: getup
      file: xgoduck_getup.onnx
      name: Get up
      name_zh: 起身
      description: Runs after a fall (tilt above 55° for 0.15 s) until the duck stands again.
    - id: pick
      file: xgoduck_pick.onnx
      name: Pick
      name_zh: 啄食
      description: One 4 s pick cycle, played while walking upright.
    - id: roulade
      file: xgoduck_roulade.onnx
      name: Roulade
      name_zh: 翻滚
      description: The 1.9 s roulade move.
    - id: sitstand
      file: xgoduck_sitstand.onnx
      name: Sit
      name_zh: 坐下
      description: Used by Sit in the duck's web page, which sits the duck down and stands it up again.
    - id: ballkick_left
      file: xgoduck_ballkick_left.onnx
      name: Left kick
      name_zh: 左脚踢球
      description: Used by left_kick in the duck's web page.
    - id: ballkick_right
      file: xgoduck_ballkick_right.onnx
      name: Right kick
      name_zh: 右脚踢球
      description: Used by right_kick in the duck's web page.

actions:
  - label: Cockpit
    label_zh: 驾驶舱
    url: http://{host}/
    description: The phone cockpit on port 80 (drive, camera, microphone, speaker, AI binding). The system setup installs it.
  - label: Calibration
    label_zh: 标定
    url: /calibrate.html
    description: Set the servo centers, all at once from the folded pose in the page's reference photos, or one joint at a time.
  - label: Servo setup
    label_zh: 舵机设置
    url: /servo.html
    description: Scan the bus, set servo IDs and protection.

uninstall:
  description: Puts back the library files prepare-bridge.py patched.
  description_zh: 把 prepare-bridge.py 打过补丁的库文件恢复原样。
  run: |
    for f in "$HOME"/.arduino15/internal/Arduino_RouterBridge_*/Arduino_RouterBridge/src/bridge.h.original \
             "$HOME"/.arduino15/internal/Arduino_RPClite_*/Arduino_RPClite/src/decoder.h.original; do
      if [ -f "$f" ]; then mv -f "$f" "${f%.original}"; fi
    done
    rm -f "$HOME"/.arduino15/internal/Arduino_RPClite_*/Arduino_RPClite/src/duck_msgpack_frame.h
